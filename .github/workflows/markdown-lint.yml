name: Markdown Lint

on:
  push:
    branches: [ main, feature/**, feat/knowledge-network-enhancement ]
  pull_request:
    branches: [ main, feat/knowledge-network-enhancement ]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install markdownlint
      run: npm install -g markdownlint-cli
    
    - name: Check README structure and local links
      run: python3 scripts/check_readme.py

    - name: Lint Markdown files
      run: markdownlint '**/*.md' --ignore node_modules --ignore .trunk --ignore .sisyphus
